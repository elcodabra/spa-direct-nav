<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPA Direct Nav</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>SPA Direct Nav</h1>
      <p class="origin" id="origin">—</p>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" id="tabNavBtn" data-tab="nav" role="tab" aria-selected="true">Navigate</button>
      <button class="tab" id="tabRecentBtn" data-tab="recent" role="tab" aria-selected="false">Recent</button>
      <button class="tab" id="tabApiBtn" data-tab="api" role="tab" aria-selected="false">API routing</button>
      <button class="tab" id="tabMockBtn" data-tab="mock" role="tab" aria-selected="false">Mock API</button>
      <button class="tab" id="tabSitesBtn" data-tab="sites" role="tab" aria-selected="false">Sites</button>
    </nav>

    <div class="tabpanel" id="tab-nav" role="tabpanel">
      <label class="field">
        <span>Path or full URL</span>
        <input
          id="target"
          type="text"
          placeholder="/dashboard/settings or https://app.example.com/page"
          autocomplete="off"
          spellcheck="false"
        />
      </label>

      <div class="mode">
        <label title="Uses the History API + popstate so the SPA router reacts without a full page reload.">
          <input type="radio" name="mode" value="soft" checked />
          Soft (SPA route, no reload)
        </label>
        <label title="Sets window.location — performs a full page load at the target URL.">
          <input type="radio" name="mode" value="hard" />
          Hard (full reload)
        </label>
      </div>

      <div class="actions">
        <button id="go" class="primary">Go</button>
        <button id="useCurrent" class="ghost" title="Fill the box with the current page path">Current</button>
      </div>

      <div class="auto-block">
        <label class="auto" title="On any site, automatically recover deep links the server 404s on a cold load (address bar, refresh, shared links).">
          <input type="checkbox" id="autoAll" />
          <span>Auto-fix deep links on all sites</span>
        </label>
        <label class="auto sub" title="Skip auto-fix on this host only.">
          <input type="checkbox" id="blockHost" />
          <span>Disable on <b id="autoHostName">this host</b></span>
        </label>
        <label class="auto sub" title="Print diagnostic logs to the page and service-worker consoles.">
          <input type="checkbox" id="debugLog" />
          <span>Debug logging</span>
        </label>
      </div>
    </div>

    <div class="tabpanel" id="tab-api" role="tabpanel" hidden>
      <p class="apis-on">On <b id="apiSite">this site</b>, send requests under a path to another server.</p>
      <div class="api-form">
        <input id="apiPrefix" type="text" placeholder="/api" autocomplete="off" spellcheck="false" />
        <span class="arrow">→</span>
        <input id="apiTarget" type="text" placeholder="https://my-api.dev" autocomplete="off" spellcheck="false" />
        <button id="apiAdd" class="ghost">Add</button>
      </div>
      <ul id="apiList"></ul>
    </div>

    <div class="tabpanel" id="tab-mock" role="tabpanel" hidden>
      <p class="apis-on">On <b id="mockSite">this site</b>, return a canned response for a path — no network call.</p>
      <div class="mock-form">
        <div class="mock-row">
          <select id="mockMethod" title="HTTP method to match">
            <option value="ANY">ANY</option>
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="PATCH">PATCH</option>
            <option value="DELETE">DELETE</option>
          </select>
          <input id="mockPath" type="text" placeholder="/api/users" autocomplete="off" spellcheck="false" />
          <input id="mockStatus" type="number" min="100" max="599" value="200" title="Response status" />
        </div>
        <textarea id="mockBody" rows="4" placeholder='{"ok": true}' spellcheck="false"></textarea>
        <button id="mockAdd" class="ghost">Add mock</button>
      </div>
      <ul id="mockList"></ul>
    </div>

    <div class="tabpanel" id="tab-sites" role="tabpanel" hidden>
      <div class="site-head">
        <span class="site-state" id="siteState">—</span>
        <button id="siteHere" class="ghost small">Turn off on this site</button>
      </div>
      <div class="mode site-mode">
        <label title="The extension runs on every site except the ones in the blacklist.">
          <input type="radio" name="siteMode" value="blacklist" />
          Everywhere except the blacklist
        </label>
        <label title="The extension runs only on the sites in the whitelist.">
          <input type="radio" name="siteMode" value="whitelist" />
          Only on the whitelist
        </label>
      </div>
      <div class="recent-head">
        <span id="siteListTitle">Blacklist: never runs on</span>
        <button id="siteReset" class="link" title="Add the default everyday sites back">add defaults</button>
      </div>
      <div class="api-form">
        <input id="siteInput" type="text" placeholder="example.com (covers subdomains)" autocomplete="off" spellcheck="false" />
        <button id="siteAdd" class="ghost">Add</button>
      </div>
      <ul id="siteList" class="site-list"></ul>
      <p class="apis-on hint">Changes apply to pages loaded after the change. Reload open tabs.</p>
    </div>

    <div class="tabpanel" id="tab-recent" role="tabpanel" hidden>
      <section class="recent">
        <div class="recent-head">
          <span>Recent destinations</span>
          <button id="clear" class="link">clear</button>
        </div>
        <ul id="history"></ul>
      </section>
    </div>

    <p class="status" id="status"></p>
  </div>

  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
